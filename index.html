<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>TCAS Mate</title>

  <!-- ตั้งค่าสำหรับ iOS Safari (PWA) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="TCAS Mate">
  <link rel="apple-touch-icon" href="icon-512.png">

  <!-- Manifest & Theme Color -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#6366F1">

  <!-- CDN: Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
      -webkit-tap-highlight-color: transparent; 
    }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 16px); }
    .pt-safe { padding-top: env(safe-area-inset-top, 16px); }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

  <!-- แถบด้านบน (Header Bar) -->
  <header class="bg-white/95 backdrop-blur sticky top-0 z-20 border-b border-slate-100 px-5 py-3 pt-safe flex justify-between items-center shadow-sm">
    <div>
      <h1 class="text-xl font-bold bg-gradient-to-r from-indigo-600 to-violet-600 bg-clip-text text-transparent">TCAS Mate</h1>
      <p class="text-xs text-slate-400">ระบบติดตามการสมัครเข้าศึกษาต่อ</p>
    </div>
    <div class="flex gap-2">
      <button onclick="openSettingsModal()" class="p-2 text-slate-400 hover:text-indigo-600 rounded-full hover:bg-slate-50 transition" title="ตั้งค่าเชื่อมต่อ">
        <i data-lucide="settings" class="w-5 h-5"></i>
      </button>
      <button onclick="fetchData()" class="p-2 text-slate-400 hover:text-indigo-600 rounded-full hover:bg-slate-50 transition" title="รีเฟรชข้อมูล">
        <i data-lucide="refresh-cw" class="w-5 h-5"></i>
      </button>
    </div>
  </header>

  <!-- พื้นที่เนื้อหาหลัก -->
  <main class="flex-1 max-w-md mx-auto w-full p-4 space-y-4">
    <!-- แดชบอร์ดสรุปยอดสถานะ -->
    <div class="grid grid-cols-4 gap-2 text-center">
      <div class="bg-indigo-50 border border-indigo-100 rounded-2xl p-2.5">
        <div id="stat-total" class="text-lg font-bold text-indigo-600">0</div>
        <div class="text-[11px] text-indigo-500 font-medium">ยื่นทั้งหมด</div>
      </div>
      <div class="bg-amber-50 border border-amber-100 rounded-2xl p-2.5">
        <div id="stat-preparing" class="text-lg font-bold text-amber-600">0</div>
        <div class="text-[11px] text-amber-500 font-medium">กำลังทำ</div>
      </div>
      <div class="bg-sky-50 border border-sky-100 rounded-2xl p-2.5">
        <div id="stat-interview" class="text-lg font-bold text-sky-600">0</div>
        <div class="text-[11px] text-sky-500 font-medium">สัมภาษณ์</div>
      </div>
      <div class="bg-emerald-50 border border-emerald-100 rounded-2xl p-2.5">
        <div id="stat-passed" class="text-lg font-bold text-emerald-600">0</div>
        <div class="text-[11px] text-emerald-500 font-medium">ติดแล้ว</div>
      </div>
    </div>

    <!-- แถบค้นหา -->
    <div class="relative">
      <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3.5 top-3"></i>
      <input type="text" id="searchInput" oninput="renderCards()" placeholder="ค้นหามหาวิทยาลัย คณะ สาขา หรือโครงการ..."
        class="w-full bg-white border border-slate-200 rounded-xl pl-10 pr-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition">
    </div>

    <!-- รายการการ์ดโครงการ -->
    <div id="cardList" class="space-y-3 pb-24">
      <div class="text-center py-12 text-slate-400 text-sm">กำลังโหลดข้อมูล...</div>
    </div>
  </main>

  <!-- ปุ่มเพิ่มโครงการ (FAB) -->
  <div class="fixed bottom-6 right-6 z-20 pb-safe">
    <button onclick="openAddModal()" class="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-5 py-3 rounded-full shadow-lg shadow-indigo-600/30 active:scale-95 transition">
      <i data-lucide="plus" class="w-5 h-5"></i>
      <span>เพิ่มโครงการ</span>
    </button>
  </div>

  <!-- ป๊อปอัปตั้งค่า URL Web App -->
  <div id="settingsModal" class="hidden fixed inset-0 z-50 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-sm w-full p-5 space-y-4 shadow-xl">
      <h3 class="text-base font-bold text-slate-800">ตั้งค่าการเชื่อมต่อ (Web App URL)</h3>
      <p class="text-xs text-slate-500 leading-relaxed">
        ระบุลิงก์ Google Apps Script ประจำตัวของคุณที่ลงท้ายด้วย <code class="bg-slate-100 px-1 py-0.5 rounded text-indigo-600 font-mono">/exec</code>
      </p>
      <input type="url" id="scriptUrlInput" placeholder="https://script.google.com/macros/s/.../exec"
        class="w-full border border-slate-200 rounded-xl p-2.5 text-xs focus:outline-none focus:border-indigo-500 font-mono">
      <div class="flex gap-2 justify-end pt-1">
        <button type="button" onclick="closeSettingsModal()" class="px-4 py-2 text-xs text-slate-500 hover:text-slate-700">ยกเลิก</button>
        <button type="button" onclick="saveSettings()" class="px-4 py-2 text-xs bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-xl transition">บันทึก</button>
      </div>
    </div>
  </div>

  <!-- ป๊อปอัปแบบฟอร์มเพิ่มโครงการ -->
  <div id="addModal" class="hidden fixed inset-0 z-50 bg-black/40 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white rounded-t-3xl sm:rounded-2xl max-w-md w-full p-6 space-y-4 max-h-[85vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 class="font-bold text-slate-800 text-base">เพิ่มโครงการใหม่</h3>
        <button type="button" onclick="closeAddModal()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <form id="projectForm" onsubmit="submitProject(event)" class="space-y-3 text-xs">
        <div>
          <label class="font-medium text-slate-600 block mb-1">มหาวิทยาลัย *</label>
          <input type="text" id="formUniv" required placeholder="เช่น จุฬาลงกรณ์มหาวิทยาลัย, สจล." class="w-full border border-slate-200 rounded-xl p-2.5 text-sm focus:outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="font-medium text-slate-600 block mb-1">คณะ *</label>
          <input type="text" id="formFac" required placeholder="เช่น วิศวกรรมศาสตร์" class="w-full border border-slate-200 rounded-xl p-2.5 text-sm focus:outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="font-medium text-slate-600 block mb-1">สาขาวิชา / หลักสูตร *</label>
          <input type="text" id="formMajor" required placeholder="เช่น วิศวกรรมเซมิคอนดักเตอร์" class="w-full border border-slate-200 rounded-xl p-2.5 text-sm focus:outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="font-medium text-slate-600 block mb-1">โครงการที่เปิดรับ *</label>
          <input type="text" id="formProj" required placeholder="เช่น ช้างเผือก, สอวน., เรียนดี" class="w-full border border-slate-200 rounded-xl p-2.5 text-sm focus:outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="font-medium text-slate-600 block mb-1">สถานะการสมัคร</label>
          <select id="formStatus" class="w-full border border-slate-200 rounded-xl p-2.5 text-xs focus:outline-none focus:border-indigo-500 bg-white">
            <option value="กำลังเตรียมพอร์ต">กำลังเตรียมพอร์ต</option>
            <option value="ส่งเอกสารแล้ว">ส่งเอกสารแล้ว</option>
            <option value="รอสัมภาษณ์">รอสัมภาษณ์</option>
            <option value="ผ่านการคัดเลือก">ผ่านการคัดเลือก</option>
            <option value="ไม่ผ่าน">ไม่ผ่าน</option>
          </select>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="font-medium text-slate-600 block mb-1">วันเปิดรับ</label>
            <input type="date" id="formStart" class="w-full border border-slate-200 rounded-xl p-2 text-xs focus:outline-none focus:border-indigo-500">
          </div>
          <div>
            <label class="font-medium text-slate-600 block mb-1">วันปิดรับ</label>
            <input type="date" id="formEnd" class="w-full border border-slate-200 rounded-xl p-2 text-xs focus:outline-none focus:border-indigo-500">
          </div>
        </div>
        <div>
          <label class="font-medium text-slate-600 block mb-1">แนบไฟล์พอร์ต/เอกสารเข้า Drive (PDF, รูป)</label>
          <input type="file" id="formFile" accept=".pdf,image/*" class="w-full text-slate-400 file:mr-3 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:text-xs file:bg-indigo-50 file:text-indigo-600 file:font-medium">
        </div>
        <button type="submit" id="btnSubmit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 rounded-xl mt-4 active:scale-98 transition flex justify-center items-center gap-2">
          <span>บันทึกข้อมูล</span>
        </button>
      </form>
    </div>
  </div>

  <script>
    let appData = [];
    const STORAGE_KEY = 'tcas_mate_script_url';

    // ลงทะเบียน Service Worker สำหรับการทำงานแบบ PWA
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(console.error);
    }

    function getScriptUrl() {
      return localStorage.getItem(STORAGE_KEY) || '';
    }

    window.onload = () => {
      lucide.createIcons();
      if (!getScriptUrl()) {
        openSettingsModal();
      } else {
        fetchData();
      }
    };

    function openSettingsModal() {
      document.getElementById('scriptUrlInput').value = getScriptUrl();
      document.getElementById('settingsModal').classList.remove('hidden');
    }
    function closeSettingsModal() {
      document.getElementById('settingsModal').classList.add('hidden');
    }
    function saveSettings() {
      const url = document.getElementById('scriptUrlInput').value.trim();
      if (url) {
        localStorage.setItem(STORAGE_KEY, url);
        closeSettingsModal();
        fetchData();
      }
    }

    // ปรับโครงสร้างข้อมูลให้รองรับทั้งคีย์ไทยและคีย์อังกฤษ
    function normalizeItem(d) {
      return {
        id: d.id || d["ID"] || "",
        university: d.university || d["มหาวิทยาลัย"] || "",
        faculty: d.faculty || d["คณะ"] || "",
        major: d.major || d["สาขาวิชา / หลักสูตร"] || "",
        project: d.project || d["โครงการที่เปิดรับ"] || "",
        status: d.status || d["สถานะการสมัคร"] || "กำลังเตรียมพอร์ต",
        startDateStr: d.startDateStr || d["วันเปิดรับสมัคร"] || "",
        endDateStr: d.endDateStr || d["วันปิดรับสมัคร"] || "",
        deadlinePayment: d.deadlinePayment || d["วันสุดท้ายที่ชำระเงิน"] || "",
        interviewDate: d.interviewDate || d["วันสัมภาษณ์"] || "",
        portalUrl: d.portalUrl || d["เว็บไซต์ระบบรับสมัคร"] || "",
        portfolioUrl: d.portfolioUrl || d["ลิงก์เล่ม Portfolio"] || "",
        notes: d.notes || d["บันทึกช่วยจำ / เลขที่ผู้สมัคร"] || "",
        isStarred: String(d.isStarred || d["ติดดาว"] || "false") === "true"
      };
    }

    // ดึงข้อมูลจาก Google Apps Script
    async function fetchData() {
      const url = getScriptUrl();
      if (!url) return;
      const cardList = document.getElementById('cardList');
      cardList.innerHTML = '<div class="text-center py-12 text-slate-400 text-sm">กำลังซิงก์ข้อมูล...</div>';

      try {
        const res = await fetch(url);
        const rawData = await res.json();
        appData = Array.isArray(rawData) ? rawData.map(normalizeItem) : [];
        updateStats();
        renderCards();
      } catch (err) {
        cardList.innerHTML = `<div class="text-center py-12 text-rose-500 text-sm">โหลดข้อมูลไม่สำเร็จ กรุณาตรวจสอบ URL ในการตั้งค่า</div>`;
      }
    }

    function updateStats() {
      document.getElementById('stat-total').innerText = appData.length;
      document.getElementById('stat-preparing').innerText = appData.filter(d => 
        d.status.includes('เตรียมพอร์ต') || d.status.includes('กำลังทำ')
      ).length;
      document.getElementById('stat-interview').innerText = appData.filter(d => 
        d.status.includes('สัมภาษณ์')
      ).length;
      document.getElementById('stat-passed').innerText = appData.filter(d => 
        d.status.includes('ผ่าน') || d.status.includes('ติด')
      ).length;
    }

    function renderCards() {
      const q = document.getElementById('searchInput').value.trim().toLowerCase();
      const list = document.getElementById('cardList');
      const filtered = appData.filter(d => 
        (d.university || '').toLowerCase().includes(q) ||
        (d.faculty || '').toLowerCase().includes(q) ||
        (d.major || '').toLowerCase().includes(q) ||
        (d.project || '').toLowerCase().includes(q)
      );

      if (filtered.length === 0) {
        list.innerHTML = '<div class="text-center py-12 text-slate-400 text-sm">ไม่พบรายการที่ค้นหา</div>';
        return;
      }

      list.innerHTML = filtered.map(d => {
        const univChar = (d.university || 'ม').trim().charAt(0);
        let badgeStyle = 'bg-slate-50 text-slate-600 border border-slate-100';
        if (d.status.includes('ผ่าน') || d.status.includes('ติด')) {
          badgeStyle = 'bg-emerald-50 text-emerald-600 border border-emerald-100';
        } else if (d.status.includes('สัมภาษณ์')) {
          badgeStyle = 'bg-sky-50 text-sky-600 border border-sky-100';
        } else if (d.status.includes('เตรียมพอร์ต')) {
          badgeStyle = 'bg-amber-50 text-amber-600 border border-amber-100';
        }

        return `
          <div class="bg-white border border-slate-100 rounded-2xl p-4 shadow-sm space-y-2">
            <div class="flex justify-between items-start">
              <span class="w-8 h-8 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center font-bold text-xs">
                ${univChar}
              </span>
              <span class="text-[11px] px-2.5 py-0.5 rounded-full font-medium ${badgeStyle}">
                ${d.status || 'กำลังเตรียมพอร์ต'}
              </span>
            </div>
            <div>
              <h4 class="font-bold text-slate-800 text-sm">${d.university || '-'}</h4>
              <p class="text-xs text-slate-500">${d.faculty || '-'} · ${d.major || '-'}</p>
              <p class="text-xs text-indigo-600 font-medium mt-1">โครงการ: ${d.project || '-'}</p>
            </div>
            <div class="text-[11px] text-slate-400 flex items-center gap-1.5 pt-1 border-t border-slate-50">
              <i data-lucide="calendar" class="w-3.5 h-3.5"></i>
              <span>${d.startDateStr || '-'} ถึง ${d.endDateStr || '-'}</span>
            </div>
            ${d.portfolioUrl ? `
              <div class="pt-1 border-t border-slate-50">
                <a href="${d.portfolioUrl}" target="_blank" class="inline-flex items-center gap-1 text-[11px] text-indigo-600 hover:underline">
                  <i data-lucide="file-text" class="w-3.5 h-3.5"></i> ดูไฟล์พอร์ตใน Google Drive
                </a>
              </div>
            ` : ''}
          </div>
        `;
      }).join('');
      lucide.createIcons();
    }

    function openAddModal() { document.getElementById('addModal').classList.remove('hidden'); }
    function closeAddModal() { document.getElementById('addModal').classList.add('hidden'); }

    // แปลงไฟล์เป็น Base64
    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = error => reject(error);
      });
    }

    // บันทึกโครงการใหม่
    async function submitProject(e) {
      e.preventDefault();
      const btn = document.getElementById('btnSubmit');
      btn.disabled = true;
      btn.innerHTML = '<span>กำลังบันทึก...</span>';

      const scriptUrl = getScriptUrl();
      const fileInput = document.getElementById('formFile');
      let uploadedFileUrl = '';

      try {
        // ขั้นตอนที่ 1: อัปโหลดไฟล์เข้า Google Drive ถ้ามีการเลือกไฟล์
        if (fileInput.files.length > 0) {
          const file = fileInput.files[0];
          const b64 = await fileToBase64(file);
          const uploadPayload = {
            action: 'uploadFile',
            fileName: file.name,
            mimeType: file.type,
            base64Data: b64
          };
          const upRes = await fetch(scriptUrl, {
            method: 'POST',
            body: JSON.stringify(uploadPayload)
          });
          const upJson = await upRes.json();
          if (upJson.status === 'success') {
            uploadedFileUrl = upJson.fileUrl;
          }
        }

        // ขั้นตอนที่ 2: บันทึกข้อมูลโครงการเข้า Google Sheets
        const projectPayload = {
          action: 'create',
          data: {
            university: document.getElementById('formUniv').value.trim(),
            faculty: document.getElementById('formFac').value.trim(),
            major: document.getElementById('formMajor').value.trim(),
            project: document.getElementById('formProj').value.trim(),
            status: document.getElementById('formStatus').value,
            startDateStr: document.getElementById('formStart').value,
            endDateStr: document.getElementById('formEnd').value,
            portfolioUrl: uploadedFileUrl
          }
        };

        await fetch(scriptUrl, {
          method: 'POST',
          body: JSON.stringify(projectPayload)
        });

        document.getElementById('projectForm').reset();
        closeAddModal();
        await fetchData();
      } catch (err) {
        alert('เกิดข้อผิดพลาดในการบันทึก: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<span>บันทึกข้อมูล</span>';
      }
    }
  </script>
</body>
</html>
